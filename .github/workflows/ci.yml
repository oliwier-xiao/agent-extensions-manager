name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  helper:
    name: helper checks + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: python3 -m py_compile bin/agent-skills
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Runs identically without PyYAML
        # PyYAML is not in the Omarchy base package set. The helper must never
        # start depending on it again: a token count that changes depending on
        # an optional module is worse than a simpler parser.
        run: |
          mkdir -p /tmp/noyaml && printf 'raise ImportError("blocked")\n' > /tmp/noyaml/yaml.py
          PYTHONPATH=/tmp/noyaml python3 -m unittest discover -s tests
      - name: Helper imports no third-party module
        run: |
          ! grep -nE '^\s*(import|from)\s+(yaml|requests|toml[^l]|tomlkit)' bin/agent-skills
      - name: Scan survives an empty HOME
        # No agent installed at all is a normal first run, not an error.
        run: |
          HOME=$(mktemp -d) python3 bin/agent-skills scan | python3 -c \
            'import json,sys; d=json.load(sys.stdin); assert d["items"]==[], d; print("empty HOME ok")'

  preflight:
    name: marketplace preflight
    # The one gate that measures the tree against the marketplace's published
    # rules: the structural validator, the automated security baseline, and the
    # demands its manual review raised on this author twice. It subsumes the
    # manifest shape and the QML rules -- among them the property name that
    # begins with a capital, which QML reserves for type names and refuses to
    # declare at all. The error aborts the whole document, so a lazily loaded
    # Panel.qml becomes a null Loader item and the bar widget opens nothing,
    # with a WARN line in the shell journal as the only symptom. That is how it
    # survived a review and a release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every marketplace and reviewer rule
        # The script reads the git index and the origin URL, never the history,
        # so the default shallow checkout is all it needs, and it makes no
        # network calls. qmllint and omarchy-plugin-validate exist only on an
        # Omarchy box; preflight runs every rule it can and skips those two
        # where they are absent, which on a runner is always.
        run: bash tests/preflight.sh
